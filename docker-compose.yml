services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gamestats-db
    environment:
      POSTGRES_DB: gamestats_rag
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5440:5432"   # 5440 en el host para no chocar con otro PostgreSQL local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d gamestats_rag"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
